<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - ATEKA Logs</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-4 md:p-8 font-sans text-slate-800">
    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- HEADER DASBOR -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <div class="flex items-center gap-2.5">
                    <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
                    <h1 class="text-2xl font-black text-slate-800">ATEKA Full-Stack Dashboard</h1>
                </div>
                <p class="text-xs text-slate-500 mt-1">Real-Time Monitoring MySQL (FastAPI Web & Baileys WhatsApp Bot)</p>
            </div>
            <div class="flex flex-wrap gap-2.5">
                <a href="/api/export-csv" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2.5 px-4 rounded-xl shadow-sm transition">
                    📥 Download CSV Web
                </a>
                <a href="/api/export-csv-wa" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2.5 px-4 rounded-xl shadow-sm transition">
                    📥 Download CSV WhatsApp
                </a>
            </div>
        </div>

        <!-- DUA TABEL UTAMA -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            
            <!-- TABEL 1: LOG WEBSITE -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-base font-black text-slate-800">🌐 Kunjungan Website</h2>
                    <span id="webCountBadge" class="text-xs font-bold bg-blue-50 text-blue-700 px-3 py-1 rounded-lg border border-blue-200">0 Klik</span>
                </div>
                <div class="overflow-x-auto rounded-xl border border-slate-200 h-96 overflow-y-auto">
                    <table class="min-w-full text-left text-xs">
                        <thead class="bg-slate-100 text-slate-600 font-bold sticky top-0 border-b border-slate-200">
                            <tr>
                                <th class="px-4 py-3">ID</th>
                                <th class="px-4 py-3">IP Address</th>
                                <th class="px-4 py-3">Waktu Kunjungan</th>
                            </tr>
                        </thead>
                        <tbody id="webTable" class="divide-y divide-slate-100">
                            <tr><td colspan="3" class="text-center py-6 text-slate-400">Memuat data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- TABEL 2: LOG WHATSAPP -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-base font-black text-slate-800">💬 Pelanggan Bot WhatsApp</h2>
                    <span id="waCountBadge" class="text-xs font-bold bg-emerald-50 text-emerald-700 px-3 py-1 rounded-lg border border-emerald-200">0 Klien</span>
                </div>
                <div class="overflow-x-auto rounded-xl border border-slate-200 h-96 overflow-y-auto">
                    <table class="min-w-full text-left text-xs">
                        <thead class="bg-slate-100 text-slate-600 font-bold sticky top-0 border-b border-slate-200">
                            <tr>
                                <th class="px-4 py-3">Pelanggan</th>
                                <th class="px-4 py-3">Status</th>
                                <th class="px-4 py-3">Waktu</th>
                            </tr>
                        </thead>
                        <tbody id="waTable" class="divide-y divide-slate-100">
                            <tr><td colspan="3" class="text-center py-6 text-slate-400">Memuat data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        function escapeHtml(str) {
            return String(str || '').replace(/[&<>"']/g, s => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[s]));
        }

        async function fetchWebLogs() {
            const tbody = document.getElementById('webTable');
            const badge = document.getElementById('webCountBadge');
            try {
                const res = await fetch('/api/logs');
                const data = await res.json();

                if (!Array.isArray(data)) {
                    tbody.innerHTML = `<tr><td colspan="3" class="text-center py-6 text-rose-500 font-semibold">Error DB: ${escapeHtml(data.error || 'Format tidak valid')}</td></tr>`;
                    return;
                }

                badge.innerText = `${data.length} Klik`;

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" class="text-center py-6 text-slate-400">Belum ada data kunjungan web.</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map(log => `
                    <tr class="hover:bg-slate-50">
                        <td class="px-4 py-3 font-bold text-slate-500">#${escapeHtml(log.id)}</td>
                        <td class="px-4 py-3 text-blue-600 font-mono font-semibold">${escapeHtml(log.ip_address)}</td>
                        <td class="px-4 py-3 text-slate-500">${escapeHtml(log.created_at)}</td>
                    </tr>
                `).join('');
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="3" class="text-center py-6 text-rose-500">Gagal terhubung ke server API.</td></tr>';
            }
        }

        async function fetchWALogs() {
            const tbody = document.getElementById('waTable');
            const badge = document.getElementById('waCountBadge');
            try {
                const res = await fetch('/api/logs-wa');
                const data = await res.json();

                if (!Array.isArray(data)) {
                    tbody.innerHTML = `<tr><td colspan="3" class="text-center py-6 text-rose-500 font-semibold">Error DB: ${escapeHtml(data.error || 'Format tidak valid')}</td></tr>`;
                    return;
                }

                badge.innerText = `${data.length} Klien`;

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" class="text-center py-6 text-slate-400">Belum ada data pelanggan WhatsApp.</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map(log => `
                    <tr class="hover:bg-slate-50">
                        <td class="px-4 py-3">
                            <div class="font-bold text-slate-800">${escapeHtml(log.nama_pelanggan)}</div>
                            <div class="text-[11px] text-slate-400 font-mono">${escapeHtml(log.nomor_wa)}</div>
                        </td>
                        <td class="px-4 py-3 text-emerald-600 font-semibold">${escapeHtml(log.status_pesan)}</td>
                        <td class="px-4 py-3 text-slate-500">${escapeHtml(log.created_at)}</td>
                    </tr>
                `).join('');
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="3" class="text-center py-6 text-rose-500">Gagal terhubung ke server API.</td></tr>';
            }
        }

        function refreshAll() {
            fetchWebLogs();
            fetchWALogs();
        }

        refreshAll();
        setInterval(refreshAll, 5000);
    </script>
</body>
</html>
